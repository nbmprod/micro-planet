<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Micro-Planet</title>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    canvas {
      display: block;
    }

    #hud {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    #title {
      margin-top: 24px;
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: rgba(255, 255, 255, 0.85);
      text-shadow: 0 0 20px rgba(120, 200, 255, 0.8);
      text-transform: uppercase;
    }

    #controls {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
    }

    #controls span {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 4px 12px;
      border-radius: 6px;
      backdrop-filter: blur(4px);
    }

    #hud-stats {
      position: fixed;
      top: 24px;
      right: 24px;
      color: rgba(255, 255, 255, 0.5);
      font-size: 0.75rem;
      text-align: right;
      line-height: 1.8;
    }
  </style>
</head>

<body>

  <!-- HUD Elements ─────────────────────────────────────── -->
  <div id="hud">
    <div id="title">🪐 Micro-Planet</div>
  </div>

  <div id="controls">
    <span>W / ↑ — Forward</span>
    <span>S / ↓ — Back</span>
    <span>A / ← — Turn Left</span>
    <span>D / → — Turn Right</span>
    <span>Space — Jump</span>
  </div>

  <!-- Stats panel — updated each frame by Player/GameState -->
  <!-- FUTURE_HOOK: Add pollution-level, oxygen %, biome label here -->
  <div id="hud-stats">
    <div id="stat-coords">lat: 0.0° lon: 0.0°</div>
    <div id="stat-altitude">alt: 0.00</div>
    <div id="stat-state">state: idle | zone: LAND | swim: false | grounded: true</div>
    <!-- FUTURE_HOOK: <div id="stat-pollution">pollution: 0%</div> -->
  </div>

  <!-- Canvas filled by GameEngine renderer -->
  <canvas id="game-canvas"></canvas>

  <!-- Entry point (Vite resolves TS automatically) -->
  <script type="module" src="/src/main.ts"></script>
</body>

</html>
